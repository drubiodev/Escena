<aside class="palette-panel">
    <header class="panel-header">
        <span class="panel-kicker">Library</span>
        <h1>Insert</h1>
        <p>Drag a block onto the canvas.</p>
    </header>

    <label class="palette-search">
        <span class="sr-only">Search blocks</span>
        <input type="search" placeholder="Search blocks" />
    </label>

    <!-- One flat loop avoids LadrillosJS's nested-loop scope limitation. -->
    <for each="row in rows" key="row.type">
        <div class="palette-row">
            <if condition="row.heading">
                <h2 class="palette-group">{row.heading}</h2>
            </if>

            <button class="palette-block" type="button" data-type="{row.type}" draggable="true">
                <span class="palette-icon" aria-hidden="true">{row.icon}</span>
                <span class="palette-label">{row.label}</span>
                <span class="palette-add" aria-hidden="true">+</span>
            </button>
        </div>
    </for>

    <if condition="rows.length === 0">
        <p class="palette-empty">No blocks match “{query}”.</p>
    </if>
</aside>

<script>
    let query = "";
    let rows = [];

    /** Rebuilds the flat visible rows from grouped registry definitions. */
    function buildRows() {
        const search = query.trim().toLowerCase();
        const matches = (block) =>
            !search ||
            block.label.toLowerCase().includes(search) ||
            block.type.toLowerCase().includes(search) ||
            block.category.toLowerCase().includes(search);
        const nextRows = [];

        for (const group of window.Escena.registry.byCategory()) {
            const blocks = group.items.filter(matches);
            blocks.forEach((block, index) => {
                nextRows.push({
                    ...block,
                    heading: index === 0 ? group.name : "",
                });
            });
        }

        rows = nextRows;
    }

    $host.addEventListener("input", (event) => {
        if (!event.target.matches('input[type="search"]')) return;
        query = event.target.value;
        buildRows();
    });

    $host.addEventListener("click", (event) => {
        const button = event.target.closest(".palette-block");
        if (!button || !$host.contains(button)) return;
        $emit("escena:command", { name: "block:add", type: button.dataset.type });
    });

    $host.addEventListener("dragstart", (event) => {
        const button = event.target.closest(".palette-block");
        if (!button || !$host.contains(button)) return;
        event.dataTransfer.setData("application/x-escena-block", button.dataset.type);
        event.dataTransfer.effectAllowed = "copy";
    });

    buildRows();
</script>
