<div class="escena-block-slot" $ref="slot"></div>

<script type="module">
    import { BLOCK_MAP } from "../../blocks/index.js";

    /**
     * Renders whichever block type the `type` attribute names, so the canvas
     * never has to know the list. Props arrive as a JSON string on `props`.
     *
     * Light DOM on purpose (registered with useShadowDOM: false): selection and
     * inline editing find the block with frame.querySelector("[data-block]"),
     * which a second shadow boundary would hide. That also means this file must
     * carry no <style> block — the canvas styles `e-block` instead.
     */
    function sync() {
        const type = $host.getAttribute("type");
        const def = BLOCK_MAP.get(type);

        if (!def) {
            const missing = document.createElement("div");
            missing.className = "escena-missing";
            missing.textContent = `Unknown block “${type}”`;
            $refs.slot.replaceChildren(missing);
            return;
        }

        // Recreate only when the type changes. Prop edits go through
        // setAttribute, so the element (and an inline-editing caret) survives.
        let el = $refs.slot.firstElementChild;
        if (!el || el.localName !== def.tag) {
            el = document.createElement(def.tag);
            el.setAttribute("data-block", "");
            $refs.slot.replaceChildren(el);
        }

        let props = {};
        try {
            props = JSON.parse($host.getAttribute("props") || "{}");
        } catch {
            // Malformed props: fall back to the manifest defaults below.
        }

        for (const p of def.props) {
            const value = props[p.key] ?? p.value;
            // "" would coerce to true and print "true" on the slide.
            if (value === "" || value == null) el.removeAttribute(p.key);
            else el.setAttribute(p.key, typeof value === "object" ? JSON.stringify(value) : String(value));
        }
    }

    $host.addEventListener("ladrillos:ready", () => {
        sync();
        new MutationObserver(sync).observe($host, {
            attributes: true,
            attributeFilter: ["type", "props"],
        });
    });
</script>
