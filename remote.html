<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#11110f">
    <title>Phone remote - Escena</title>
    <script type="importmap">{"imports":{"qrcode-generator":"https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm"}}</script>
    <style>
        :root {
            --bg: #11110f;
            --panel: #191816;
            --border: #302e2a;
            --text: #f4f1eb;
            --muted: #a19b91;
            --accent: #ff6b4a;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            -webkit-user-select: none;
            user-select: none;
        }

        [hidden] {
            display: none !important;
        }

        header,
        footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--panel);
        }

        header {
            border-bottom: 1px solid var(--border);
        }

        footer {
            border-top: 1px solid var(--border);
        }

        #status {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: var(--muted);
        }

        #clock {
            font-size: 22px;
            font-variant-numeric: tabular-nums;
        }

        main {
            overflow-y: auto;
            padding: 16px;
            -webkit-user-select: text;
            user-select: text;
        }

        .slide-line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 13px;
        }

        #slide-name {
            margin: 4px 0 16px;
            font: 600 20px/1.3 system-ui, sans-serif;
        }

        #notes {
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: var(--notes-size, 22px);
            line-height: 1.55;
        }

        #next-up {
            margin: 20px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        button {
            font: inherit;
            color: inherit;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #22211e;
            min-height: 48px;
            padding: 0 16px;
            touch-action: manipulation;
        }

        button:active:not(:disabled) {
            background: #292724;
        }

        button:disabled {
            opacity: 0.35;
        }

        .nav {
            flex: 1;
            min-height: 72px;
            font-size: 20px;
            font-weight: 600;
        }

        .nav.next {
            flex: 1.6;
            background: var(--accent);
            border-color: var(--accent);
            color: #1a0b06;
        }

        .small {
            min-height: 40px;
            min-width: 44px;
            padding: 0 10px;
        }

        .pairing {
            display: grid;
            gap: 16px;
            justify-items: center;
            text-align: center;
        }

        .pairing canvas {
            width: min(100%, 420px);
            height: auto;
            image-rendering: pixelated;
            border-radius: 8px;
        }

        .pairing code {
            display: block;
            max-height: 6em;
            overflow: auto;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            word-break: break-all;
            -webkit-user-select: all;
            user-select: all;
        }

        .pairing p {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <span id="status" role="status">Starting...</span>
        <button class="small" id="smaller" aria-label="Smaller notes text">A-</button>
        <button class="small" id="larger" aria-label="Larger notes text">A+</button>
        <time id="clock" hidden>00:00</time>
    </header>
    <main>
        <section class="pairing" id="pairing" hidden>
            <p id="pairing-help">Show this code to the webcam on the computer running Escena.</p>
            <canvas id="answer-qr" aria-label="Pairing answer QR code"></canvas>
            <details>
                <summary>Can't scan? Copy the code instead</summary>
                <code id="answer-code"></code>
                <button id="copy-code">Copy code</button>
            </details>
        </section>
        <section id="remote" hidden>
            <div class="slide-line"><span id="title"></span><span id="counter"></span></div>
            <h1 id="slide-name"></h1>
            <p id="notes"></p>
            <p id="next-up"></p>
        </section>
    </main>
    <footer id="controls" hidden>
        <button class="nav" data-command="prev">Previous</button>
        <button class="small" data-command="blackout" aria-label="Blackout screen">Black</button>
        <button class="nav next" data-command="next">Next</button>
    </footer>
    <script type="module" src="./app/remote.js"></script>
</body>

</html>
