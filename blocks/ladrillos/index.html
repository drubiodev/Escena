<div class="component-preview">
    <iframe $ref="frame" title="Ladrillos component preview" sandbox="allow-scripts"></iframe>
</div>

<script type="module">
    let code = "";
    let background = "#f4f0e8";
    let border = "on";
    let shadow = "on";
    let radius = 6;
    let inset = 10;

    const frameworkUrl = "https://cdn.jsdelivr.net/npm/ladrillosjs@2.1.3/dist/index.js";
    const importKeyword = "im" + "port";
    const componentTag = "scene-" + crypto.randomUUID();
    const componentCode = code === true ? "" : String(code);
    const previewBackground = String(background);
    const contentInset = Math.min(25, Math.max(0, Number(inset) || 0));
    const serializedCode = JSON.stringify(componentCode).replaceAll("<", "\\u003c");

    $host.style.border = border === "on" ? "1px solid rgb(31 28 24 / 14%)" : "none";
    $host.style.boxShadow = shadow === "on" ? "0 14px 36px rgb(31 28 24 / 14%)" : "none";
    $host.style.borderRadius = Math.min(40, Math.max(0, Number(radius) || 0)) + "px";
    $host.style.background = previewBackground;

    $refs.frame.srcdoc = `<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body, #mount { width: 100%; height: 100%; margin: 0; }
        html { background: ${previewBackground}; color-scheme: light; }
        body { overflow: auto; display: flow-root; }
        #mount { box-sizing: border-box; display: flow-root; padding: ${contentInset}vh ${contentInset}vw; }
        #error {
            display: none;
            box-sizing: border-box;
            margin: 16px;
            padding: 12px 14px;
            border-left: 4px solid #c8342f;
            background: #fff1ef;
            color: #751d19;
            font: 13px/1.45 ui-monospace, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="mount"></div>
    <pre id="error"></pre>
    <script type="importmap">
        { "imports": { "ladrillosjs": ${JSON.stringify(frameworkUrl)} } }
    <\/script>
    <script type="module">
        ${importKeyword} { configure, registerComponent } from ${JSON.stringify(frameworkUrl)};

        const showError = (error) => {
            const output = document.getElementById("error");
            output.textContent = [error?.message || String(error), error?.cause?.message].filter(Boolean).join("\\n");
            output.style.display = "block";
        };
        window.addEventListener("error", (event) => showError(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => showError(event.reason));
        configure({ onError: showError });

        try {
            for (const storageName of ["localStorage", "sessionStorage"]) {
                const values = new Map();
                Object.defineProperty(window, storageName, {
                    value: {
                        get length() { return values.size; },
                        key(index) { return [...values.keys()][index] ?? null; },
                        getItem(key) { return values.get(String(key)) ?? null; },
                        setItem(key, value) { values.set(String(key), String(value)); },
                        removeItem(key) { values.delete(String(key)); },
                        clear() { values.clear(); },
                    },
                });
            }
            const source = ${serializedCode};
            const sourceUrl = URL.createObjectURL(new Blob([source], { type: "text/html" }));
            await registerComponent(${JSON.stringify(componentTag)}, sourceUrl + "#.html", true);
            document.getElementById("mount").append(document.createElement(${JSON.stringify(componentTag)}));
            URL.revokeObjectURL(sourceUrl);
        }
        catch (error) {
            showError(error);
        }
    <\/script>
</body>
</html>`;
</script>

<style>
    :host,
    .component-preview,
    iframe {
        box-sizing: border-box;
        display: block;
        width: 100%;
        height: 100%;
    }

    :host {
        overflow: hidden;
    }

    iframe {
        border: 0;
        background: transparent;
    }
</style>
