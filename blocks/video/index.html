<div class="video-frame is-shadow-{shadow}">
    <div class="video-stage">
        <video $ref="video" playsinline preload="metadata"></video>
        <button class="play-toggle" type="button" aria-label="Play video" $ref="playButton" hidden>
            <span class="play-mark" aria-hidden="true"></span>
        </button>
        <div class="video-placeholder" $ref="placeholder" hidden>
            <span class="play-mark" aria-hidden="true"></span>
            <span $ref="message">Video unavailable</span>
        </div>
    </div>
</div>

<script type="module">
    let src = "";
    let poster = "";
    let fit = "cover";
    let controls = "on";
    let autoplay = "off";
    let loop = "off";
    let muted = "on";
    let shadow = "on";

    const source = src === true ? "" : String(src);
    const posterUrl = poster === true ? "" : String(poster);
    function showPlaceholder(message) {
        $refs.video.hidden = true;
        $refs.playButton.hidden = true;
        $refs.placeholder.hidden = false;
        $refs.message.textContent = message;
    }

    function syncPlayButton() {
        const playing = !$refs.video.paused && !$refs.video.ended;
        $refs.playButton.classList.toggle("is-playing", playing);
        $refs.playButton.setAttribute("aria-label", playing ? "Pause video" : "Play video");
    }

    $refs.video.style.objectFit = fit === "contain" ? "contain" : "cover";
    $refs.video.controls = controls === "on";
    $refs.video.autoplay = autoplay === "on";
    $refs.video.loop = loop === "on";
    $refs.video.muted = muted === "on" || autoplay === "on";
    $refs.playButton.hidden = $refs.video.controls;
    if (!$refs.video.controls) {
        $refs.playButton.addEventListener("click", () => {
            if ($refs.video.paused)
                $refs.video.play().catch(() => { });
            else
                $refs.video.pause();
        });
        $refs.video.addEventListener("play", syncPlayButton);
        $refs.video.addEventListener("pause", syncPlayButton);
        $refs.video.addEventListener("ended", syncPlayButton);
    }
    if (posterUrl) $refs.video.poster = posterUrl;
    if (!source)
        showPlaceholder("No video source");
    else {
        $refs.video.addEventListener("error", () => showPlaceholder("Video unavailable"), { once: true });
        if ($refs.video.autoplay) {
            $refs.video.addEventListener("canplay", () => {
                $refs.video.play().catch(() => { });
            }, { once: true });
        }
        $refs.video.src = source;
    }
</script>

<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    :host {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        container-type: size;
    }

    .video-frame {
        width: min(92cqw, 160cqh);
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border: 1px solid rgb(28 27 25 / 14%);
        border-radius: 8px;
        background: #f8f5ef;
        transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .video-frame.is-shadow-on {
        box-shadow:
            0 2px 4px rgb(28 27 25 / 10%),
            0 18px 38px rgb(28 27 25 / 20%),
            0 30px 58px rgb(28 27 25 / 14%);
    }

    .video-frame.is-shadow-on:hover {
        transform: translateY(-3px);
        box-shadow:
            0 2px 4px rgb(28 27 25 / 10%),
            0 22px 44px rgb(28 27 25 / 24%),
            0 36px 66px rgb(28 27 25 / 18%);
    }

    .video-stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background:
            linear-gradient(135deg, rgb(255 255 255 / 5%), transparent 45%),
            #11110f;
    }

    video {
        display: block;
        width: 100%;
        height: 100%;
        background: #11110f;
    }

    .video-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #c9c3b9;
        font: 600 14px/1.2 var(--s-font, sans-serif);
    }

    .video-placeholder[hidden] {
        display: none;
    }

    .play-toggle {
        position: absolute;
        z-index: 2;
        inset: 50% auto auto 50%;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        opacity: 1;
        transform: translate(-50%, -50%);
        transition: opacity 160ms ease, transform 160ms ease;
    }

    .play-toggle[hidden] {
        display: none;
    }

    .play-toggle:hover,
    .play-toggle:focus-visible {
        transform: translate(-50%, -50%) scale(1.08);
    }

    .play-toggle:focus-visible {
        outline: 3px solid rgb(255 255 255 / 65%);
        outline-offset: 4px;
    }

    .play-toggle.is-playing {
        opacity: 0;
    }

    .video-stage:hover .play-toggle.is-playing,
    .play-toggle.is-playing:focus-visible {
        opacity: 1;
    }

    .play-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border: 1px solid rgb(255 255 255 / 38%);
        border-radius: 50%;
        background: rgb(17 17 15 / 72%);
        box-shadow: 0 10px 28px rgb(0 0 0 / 35%);
        backdrop-filter: blur(8px);
    }

    .play-mark::before {
        width: 0;
        height: 0;
        margin-left: 5px;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 15px solid #f4f1eb;
        content: "";
    }

    .play-mark::after {
        content: none;
    }

    .is-playing .play-mark::before,
    .is-playing .play-mark::after {
        position: absolute;
        top: 21px;
        width: 5px;
        height: 20px;
        margin: 0;
        border: 0;
        background: #f4f1eb;
        content: "";
    }

    .is-playing .play-mark::before {
        left: 22px;
    }

    .is-playing .play-mark::after {
        right: 22px;
    }

    @media (prefers-reduced-motion: reduce) {
        .video-frame {
            transition: none;
        }

        .video-frame.is-shadow-on:hover {
            transform: none;
        }

        .play-toggle {
            transition: none;
        }
    }
</style>
