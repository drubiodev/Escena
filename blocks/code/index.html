<section class="snippet theme-{theme} shadow-{shadow}">
    <header class="snippet-header" $ref="header">
        <span class="file-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="filename" $ref="filename"></span>
        <span class="language" $ref="language"></span>
    </header>
    <pre class="source" style="font-size:{size}px" tabindex="0"
        aria-label="Code snippet"><span class="line-numbers" $ref="numbers" aria-hidden="true"></span><code $ref="content"></code></pre>
</section>

<script type="module">
    import { highlightCode } from "./highlight.js";

    let code = "";
    let language = "javascript";
    let filename = "";
    let theme = "dark";
    let size = 24;
    let linenumbers = "on";
    let header = "on";
    let shadow = "on";

    const source = code === true ? "" : String(code);
    const selectedLanguage = String(language);
    $refs.filename.textContent = filename === true ? "" : String(filename);
    $refs.language.textContent = selectedLanguage === "plaintext" ? "Plain text" : selectedLanguage;
    $refs.header.hidden = header !== "on";
    $refs.numbers.hidden = linenumbers !== "on";
    $refs.numbers.textContent = source.split(/\r\n|\r|\n/).map((_, index) => index + 1).join("\n");
    highlightCode($refs.content, source, selectedLanguage);
</script>

<style>
    :host {
        display: block;
        width: 100%;
        height: 100%;
    }

    * {
        box-sizing: border-box;
    }

    [hidden] {
        display: none !important;
    }

    .snippet {
        --code-bg: #181a1d;
        --code-header: #202327;
        --code-border: #363a40;
        --code-fg: #e7e9ed;
        --code-muted: #8e969f;
        --code-keyword: #f1a5b7;
        --code-string: #a9d88b;
        --code-number: #edbd85;
        --code-function: #8ecfe8;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid var(--code-border);
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--code-fg);
    }

    .theme-light {
        --code-bg: #fafbfc;
        --code-header: #eef1f3;
        --code-border: #d6dce1;
        --code-fg: #242a31;
        --code-muted: #67727c;
        --code-keyword: #a62649;
        --code-string: #276737;
        --code-number: #975617;
        --code-function: #146a85;
    }

    .shadow-on {
        box-shadow: 0 16px 40px rgb(0 0 0 / 18%);
    }

    .snippet-header {
        display: flex;
        flex: 0 0 52px;
        align-items: center;
        gap: 12px;
        padding: 0 22px;
        border-bottom: 1px solid var(--code-border);
        background: var(--code-header);
        font: 500 15px/1.3 "Avenir Next", sans-serif;
    }

    .file-mark {
        color: var(--code-function);
        font-family: monospace;
    }

    .filename {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .language {
        flex-shrink: 0;
        margin-left: auto;
        color: var(--code-muted);
        font-size: 12px;
    }

    .source {
        display: flex;
        flex: 1;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 24px;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--code-border) transparent;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        line-height: 1.6;
        tab-size: 4;
        white-space: pre;
    }

    .source:focus-visible {
        outline: 2px solid var(--code-function);
        outline-offset: -3px;
    }

    .line-numbers {
        flex-shrink: 0;
        padding-right: 24px;
        color: var(--code-muted);
        text-align: right;
        user-select: none;
    }

    code {
        display: block;
        flex-shrink: 0;
        font: inherit;
    }

    .hljs-comment,
    .hljs-quote {
        color: var(--code-muted);
        font-style: italic;
    }

    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-literal,
    .hljs-tag {
        color: var(--code-keyword);
    }

    .hljs-string,
    .hljs-regexp,
    .hljs-doctag,
    .hljs-addition {
        color: var(--code-string);
    }

    .hljs-number,
    .hljs-symbol,
    .hljs-bullet,
    .hljs-attr,
    .hljs-attribute {
        color: var(--code-number);
    }

    .hljs-title,
    .hljs-built_in,
    .hljs-type,
    .hljs-name,
    .hljs-selector-class,
    .hljs-selector-id {
        color: var(--code-function);
    }

    .hljs-meta,
    .hljs-variable,
    .hljs-template-variable {
        color: var(--code-number);
    }

    .hljs-deletion {
        color: var(--code-keyword);
    }

    .hljs-section,
    .hljs-strong {
        font-weight: 700;
    }

    .hljs-emphasis {
        font-style: italic;
    }
</style>
