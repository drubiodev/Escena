<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escena | Online Presentation Maker for Slides and Code Demos</title>
    <meta name="description"
        content="Create presentations in your browser with Escena. Build slides with code snippets, live components, images and speaker notes, then export playable HTML.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Escena">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Escena | Online Presentation Maker for Slides and Code Demos">
    <meta property="og:description"
        content="Build slides with code snippets, live components, images and speaker notes. Save editable decks locally and export playable HTML presentations.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Escena | Online Presentation Maker for Slides and Code Demos">
    <meta name="twitter:description"
        content="Build slides with code snippets, live components, images and speaker notes. Save editable decks locally and export playable HTML presentations.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Escena",
            "description": "A browser-based presentation editor for slides, code snippets and live LadrillosJS demos, with local draft saving and playable HTML export.",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Presentation software",
            "operatingSystem": "Any operating system with a modern web browser",
            "browserRequirements": "Requires JavaScript. Internet access is needed to load CDN dependencies.",
            "inLanguage": "en",
            "featureList": [
                "Drag-and-drop slide editing",
                "Syntax-highlighted code snippets",
                "Live LadrillosJS component demos",
                "Images, videos and QR codes",
                "Speaker notes and a separate presenter window",
                "Local browser draft saving",
                "Editable JSON deck import and export",
                "Playable HTML presentation export"
            ]
        }
    </script>
    <link rel="stylesheet" href="./app/theme.css">
    <script type="importmap">
        {
            "imports": {
                "ladrillosjs": "https://cdn.jsdelivr.net/npm/ladrillosjs@2.1.3/dist/index.js",
                "lucide": "https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm"
            }
        }
    </script>
</head>

<body>
    <div class="slideshow-app">
        <header class="app-bar">
            <div class="brand-lockup">
                <span class="brand-name">Escena</span>
            </div>

            <div class="document-title">
                <input class="document-name" id="document-title" aria-label="Presentation title" maxlength="200"
                    value="Untitled presentation">
                <span class="document-state" id="save-state" role="status">Local draft</span>
            </div>

            <div class="app-bar-meta">
                <button class="command-button present-button" data-command="present" aria-label="Present"
                    title="Present"><span data-icon="Play"></span><span>Present</span></button>
            </div>
        </header>

        <main class="editor-layout">
            <aside class="library-sidebar">
                <div class="sidebar-tabs" role="tablist" aria-label="Library">
                    <button id="slides-tab" role="tab" aria-selected="true" aria-controls="slides-panel"
                        data-panel="slides"><span data-icon="PanelsTopLeft"></span>Slides</button>
                    <button id="insert-tab" role="tab" aria-selected="false" aria-controls="insert-panel"
                        data-panel="insert"><span data-icon="Plus"></span>Insert</button>
                </div>
                <slide-navigator id="slides-panel" role="tabpanel" aria-labelledby="slides-tab"></slide-navigator>
                <block-palette id="insert-panel" role="tabpanel" aria-labelledby="insert-tab" hidden></block-palette>
            </aside>
            <section class="workspace">
                <editor-toolbar></editor-toolbar>

                <div class="slide-area">
                    <slide-editor></slide-editor>
                </div>

                <footer class="workspace-status">
                    <button class="status-button" data-command="notes" aria-expanded="false"><span
                            data-icon="NotebookPen"></span>Notes</button>
                    <span id="slide-counter">Slide 1 of 1</span>
                    <div class="zoom-controls"><span>16:9</span><button class="icon-button" data-command="zoom:out"
                            title="Zoom out" aria-label="Zoom out"><span data-icon="Minus"></span></button><button
                            class="status-button" id="zoom-value" data-command="zoom:fit"
                            title="Fit slide">Fit</button><button class="icon-button" data-command="zoom:in"
                            title="Zoom in" aria-label="Zoom in"><span data-icon="Plus"></span></button></div>
                </footer>
                <section class="notes-panel" id="notes-panel" hidden>
                    <div class="notes-resize-handle" id="notes-resize-handle" role="separator"
                        aria-label="Resize speaker notes" aria-orientation="horizontal" tabindex="0"><span
                            data-icon="GripHorizontal"></span></div><label for="speaker-notes">Speaker
                        notes</label><textarea id="speaker-notes" placeholder="Add speaker notes..."></textarea>
                </section>
            </section>
            <div class="inspector-sidebar">
                <div id="inspector-resize-handle" class="inspector-resize-handle" role="separator"
                    aria-label="Resize properties" aria-orientation="vertical" aria-controls="properties-pane"
                    tabindex="0" title="Resize properties"></div>
                <property-inspector id="properties-pane"></property-inspector>
            </div>
        </main>
    </div>
    <div id="app-overlays"><presentation-view hidden></presentation-view></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="open-file" type="file" accept=".json,.escena,application/json" hidden>

    <script type="module">
        import { boot } from "./app/boot.js";
        boot().catch((error) => {
            console.error(error);
            const notice = document.getElementById("toast");
            notice.hidden = false;
            notice.textContent = "Escena could not start. Check your connection and reload.";
        });
    </script>
</body>

</html>
